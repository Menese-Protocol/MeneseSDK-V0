[package]
name = "claim-scan-wasm"
version = "0.1.0"
edition = "2021"
description = "Claim-envelope scanner for the browser (vetKeys IBE trial decryption) — Menese DeFi Team"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same curve library, versions and features as ic-vetkeys 0.7.0, so every byte format matches.
ic_bls12_381 = { version = "0.10.1", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
hkdf = "0.12"
sha2 = "0.10.9"
sha3 = "0.10.8"
wasm-bindgen = "0.2.126"
# The fast filter's curve arithmetic: arkworks pairs about 1.6x faster than ic_bls12_381 in wasm32
# (2.09 vs 3.34 ms). Every result it lets through is re-checked with ic_bls12_381 (`open`).
ark-bls12-381 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"

[dev-dependencies]
# The oracle: DFINITY's own IBE implementation.
ic-vetkeys = "0.7.0"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Standalone (like prover-wasm): not a member of the repository workspace.
[workspace]
